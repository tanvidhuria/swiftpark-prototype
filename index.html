 a booking is made and then nothing else ever happens to it. There is no cancel option in My Bookings — a driver who knows they cannot come has no way to give the spot back.",body:["A 15-minute grace window the driver can see. One tap confirms arrival. If nothing happens by the time the clock runs out, the spot returns to the pool on its own.","The second button is the cancel path the current build is missing. Some share of that 40% are people who tried to do the right thing and had nowhere to do it."],metric:["Peak-hour utilisation","47%","≥70% in 4 weeks"]},arrived:{title:"The first arrival event SwiftPark has ever had",found:"The current driver flow ends at payment. There is no screen after it, and no point anywhere in the product where the system learns a car is actually in the bay.",body:["This one tap is worth more than it looks. Until it exists, the 40% no-show figure is inferred from sensors that are 87% accurate, and a driver whose spot was stolen is indistinguishable from one who never came.","It is also why I would not build the penalty system Finance asked for yet. We would be fining people on a number nobody has verified."],metric:["Verified no-show rate","40% inferred","<15% measured"]},released:{title:"Inventory comes back — and the count actually moves",found:"Booking a spot in the live build does not take it out of circulation. The zone still reads 18 of 24 available afterwards and the spot stays green in the grid.",body:["The bay goes back and the zone counter moves with it. That is the whole revenue argument: the Zone 2 manager watches 30–40% of bays sit physically empty at peak while the app turns walk-ins away with a Full sign.","The two routes here are treated differently on purpose. A driver who cancels inside their window gets a straight refund — they did us a favour. A hold that runs out in silence comes back as credit rather than being forfeited, because we have not earned the right to charge anyone yet."],metric:["Spots returned per peak hour","0 today","tracked from day 1"]},board:{title:"A warden can finally tell what has expired",found:'The live board shows "09:00 · 2 hrs" and the spot detail shows Booked From and Duration. It never shows when a booking ends, so a warden standing in the bay at 11:15 has to do the arithmetic in their head. The counter row also reads 0 total while listing eight bookings.',body:["Every row carries the end time and how long is left. Expired holds sort to the top, because those are the bays that should already be back on sale.","I also replaced Unverified — a status the current app never explains — with Awaiting arrival, which says what it means and what the warden is waiting for. Tap any row to work it."],metric:["Warden app usage","23%","≥80% in 3 weeks"]},spot:{title:"The action the wardens said they did not have",found:"The live spot detail offers exactly two actions: Confirm Valid Booking and Flag Unauthorised Vehicle. There is no option for the case the wardens described — a booking exists and the bay is empty.",body:["A warden told us plainly that nobody explained what to do when the driver never showed, so they waved the next car in and it never reached the system. Three actions now, and the middle one is the one that was missing.","This is not a new enforcement workflow. It is the warden confirming or correcting a release that Build 1 already decided — the sensor is right 87% of the time and the warden is standing in front of it."],metric:["Spot conflict rate","18%","<5% in 4 weeks"]},logged:{title:"Losing signal stops being a reason to stop working",found:'The live app already flashes "No network detected — actions will sync when online", but it crashes at least twice a shift, and opening Logged Actions traps you on a screen you have to press Back to escape even though it is a tab.',body:["Every action you log lands here with the spot it belonged to and whether it has been sent. Logged Actions is a real tab you can leave the way you came in.","Flip the connec
