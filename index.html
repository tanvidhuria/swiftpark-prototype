n nothing else ever happens to it. There is no cancel option in My Bookings — a driver who knows they cannot come has no way to give the spot back.",body:["A 15-minute grace window the driver can see. One tap confirms arrival. If nothing happens by the time the clock runs out, the spot returns to the pool on its own.","The second button is the cancel path the current build is missing. Some share of that 40% are people who tried to do the right thing and had nowhere to do it."],metric:["Peak-hour utilisation","47%","≥70% in 4 weeks"]},arrived:{title:"The first arrival event SwiftPark has ever had",found:"The current driver flow ends at payment. There is no screen after it, and no point anywhere in the product where the system learns a car is actually in the bay.",body:["This one tap is worth more than it looks. Until it exists, the 40% no-show figure is inferred from sensors that are 87% accurate, and a driver whose spot was stolen is indistinguishable from one who never came.","It is also why I would not build the penalty system Finance asked for yet. We would be fining people on a number nobody has verified."],metric:["Verified no-show rate","40% inferred","<15% measured"]},released:{title:"Inventory comes back — and the count actually moves",found:"Booking a spot in the live build does not take it out of circulation. The zone still reads 18 of 24 available afterwards and the spot stays green in the grid.",body:["Here the release puts the bay back and the zone counter moves with it. That is the whole revenue argument: the Zone 2 manager watches 30–40% of bays sit physically empty at peak while the app turns walk-ins away with a Full sign.","Money comes back as credit rather than being forfeited. We broke the promise first — we have not earned the right to charge for it."],metric:["Spots returned per peak hour","0 today","tracked from day 1"]},board:{title:"A warden can finally tell what has expired",found:'The live board shows "09:00 · 2 hrs" and the spot detail sh
